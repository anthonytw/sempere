name: Release

# Push a tag `vX.Y.Z` to build the CLI for Linux (static, x86_64 and aarch64) and macOS
# (universal), attest provenance, and publish a GitHub Release whose notes are the
# matching CHANGELOG.md section. See docs/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  prepare:
    name: Check version and changelog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read   # the release sweep's status on the tagged commit
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main; releases are cut from merged, CI-checked commits"; exit 1
          fi
      # Every suite, on a Mac (scripts/local-ci.sh --release posts `local/release-sweep`, docs/ci.md), for
      # this commit or for a swept ancestor that differs from it only in release-neutral files such as
      # CHANGELOG.md and docs (scripts/release-sweep-check.sh). A prerelease tag (vX.Y.Z-rc.1, for
      # exercising this workflow) only warns.
      - name: The commit passed the release sweep (local/release-sweep)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if line=$(scripts/release-sweep-check.sh "$GITHUB_SHA" "${{ github.repository }}"); then
            echo "$line"
          else
            case "$GITHUB_REF_NAME" in
              *-*) echo "::warning::${line#FAIL  } (prerelease tag: not blocking)" ;;
              *) echo "::error::${line#FAIL  }"; exit 1 ;;
            esac
          fi
      - id: v
        name: Tag must equal the CLI version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          version="${tag#v}"
          source_version="$(sed -n 's/^let sempereVersion = "\(.*\)"$/\1/p' Sources/SempereCLI/Version.swift)"
          if [ "$source_version" != "$version" ]; then
            echo "::error::tag $tag but Sources/SempereCLI/Version.swift says $source_version"; exit 1
          fi
          scripts/changelog-section.sh "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }} (static, musl)
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Must be the Swift version scripts/build-linux-static.sh pins its Static Linux SDK to.
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build (Static Linux SDK; checks there are no shared libraries)
        run: scripts/build-linux-static.sh ${{ matrix.arch }} dist-bin/sempere
      - name: The CLI reports the tag's version
        run: test "$(dist-bin/sempere --version | sed -n 1p)" = "sempere ${{ needs.prepare.outputs.version }}"
      - name: Package
        run: scripts/package-cli.sh dist-bin/sempere "${{ needs.prepare.outputs.version }}" "linux-${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The Linux tarballs, installed as the docs say, run on old and new distributions (glibc and musl).
  # Each image runs under `docker run` from the host: JavaScript actions cannot run inside Alpine.
  linux-distros:
    name: Linux ${{ matrix.arch }} on other distributions
    needs: [prepare, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist
      - name: Install and run in Debian 12, Ubuntu 22.04 and 26.04, Fedora 41, Alpine 3.20
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          status=0
          for image in debian:12 ubuntu:22.04 ubuntu:26.04 fedora:41 alpine:3.20; do
            docker run --rm -v "$PWD:/w:ro" "$image" sh -c '
              if command -v apk >/dev/null; then apk add -q ca-certificates >/dev/null
              elif command -v apt-get >/dev/null; then apt-get update -qq >/dev/null && apt-get install -y -qq ca-certificates >/dev/null
              fi
              sh /w/scripts/smoke-linux-cli.sh "/w/dist/sempere-$0-linux-$1.tar.gz" "$0"' "$VERSION" "$ARCH" \
              || { echo "::error::$image ($ARCH) failed"; status=1; }
          done
          exit $status

  macos:
    name: macOS universal
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Build arm64 + x86_64
        run: swift build -c release --product sempere --arch arm64 --arch x86_64
      - name: Verify the binary
        run: |
          bin="$(swift build -c release --product sempere --arch arm64 --arch x86_64 --show-bin-path)/sempere"
          lipo -archs "$bin" | tee /dev/stderr | grep -q arm64
          lipo -archs "$bin" | grep -q x86_64
          test "$("$bin" --version | sed -n 1p)" = "sempere ${{ needs.prepare.outputs.version }}"
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package-cli.sh "$BIN" "${{ needs.prepare.outputs.version }}" macos-universal dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-universal
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Checksums, attestations, release
    needs: [prepare, linux, linux-distros, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "${{ needs.prepare.outputs.version }}" > release-notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # A tag with a prerelease suffix (v1.0.0-rc.1) is published as a prerelease.
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "Sempere CLI $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag "${flags[@]}"
