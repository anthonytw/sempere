name: PR description

# Every pull request lists the targeted tests its author ran beyond the PR gate (docs/ci.md,
# CLAUDE.md): a `## Tests run` section that is not empty. Its own workflow, not a job of
# ci.yml, because it must run when the description is edited: an `edited` event in ci.yml would
# cancel that PR's running CI (its concurrency group) and record skipped results for its required
# jobs on the head commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests-run:
    name: PR lists tests run
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check-tests-run.py
          sparse-checkout-cone-mode: false
      - name: The description has a non-empty "Tests run" section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          N: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/check-tests-run.py --self-test
          # The hosted gate does not run the Mac Catalyst app tests: a PR that touches Apps/ must list its own run of them.
          # The list is captured first: a failed `gh api` fails this step (bash -e) instead of reading as "no Apps/ files",
          # which `gh api ... | grep -q` did (a pipeline's status is grep's, so the check failed open).
          files=$(gh api "repos/$R/pulls/$N/files" --paginate --jq '.[].filename')
          flag=""
          if grep -q '^Apps/' <<<"$files"; then flag=--app-changed; fi
          python3 scripts/check-tests-run.py $flag
