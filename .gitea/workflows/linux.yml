# The Linux jobs on the lab's Gitea runner (docs/ci.md, docs/design/local-first.md). Each job is
# scripts/ci-linux.sh, the same script `just ci-linux` runs in Docker on a Mac. The runner is
# sysadmin's orin-sempere (label orin-aarch64-sempere: swift:6.4.2-noble, one job at a time, no
# Docker for jobs, unshare allowed for the offline guard; sysadmin docs/fil-ci-runner.md §2).
# The Mac work (the PR gate, local/app-tests) runs on the Mac: scripts/local-ci.sh.
name: Linux

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  # The runner's memory is shared with other CI: cap the compile and test parallelism.
  SEMPERE_BUILD_JOBS: "4"

jobs:
  test:
    name: Linux package tests (offline), portability, removable importers
    runs-on: orin-aarch64-sempere
    timeout-minutes: 80
    container:
      image: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
      # Named volumes of the runner's job daemon (its valid_volumes). Shared by every ref: fine for
      # CI, never for release binaries (those are built on the Mac, scripts/release-build.sh).
      volumes:
        - fil-ci-sempere-build:/cache/build
    steps:
      # Plain git: the image has no Node for actions/checkout.
      - name: Check out
        run: |
          git init -q .
          git -c http.extraheader="Authorization: token ${{ github.token }}" \
            fetch -q --depth=1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          ln -sfn /cache/build .build
      - name: Test
        run: scripts/ci-linux.sh test

  webdav:
    name: WebDAV integration tests (wsgidav)
    runs-on: orin-aarch64-sempere
    timeout-minutes: 60
    container:
      image: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
      volumes:
        - fil-ci-sempere-build:/cache/build
    steps:
      - name: Check out
        run: |
          git init -q .
          git -c http.extraheader="Authorization: token ${{ github.token }}" \
            fetch -q --depth=1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
          ln -sfn /cache/build .build
      - name: WebDAV tests
        run: scripts/ci-linux.sh webdav
